# Prefix
set -g prefix C-Space
set -g prefix2 C-a
bind C-Space send-prefix

# Pane Controls
bind | split-window -h -v -c "#{pane_current_path}"
bind - split-window -v -v -c "#{pane_current_path}"
bind -n M-s split-window -v -c "#{pane_current_path}"
bind -n M-v split-window -h -c "#{pane_current_path}"
bind -n M-q kill-pane

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi mode for copy
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
if-shell 'command -v wl-copy' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-cppy"' \
  'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"' \
